<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Flowtask favicon on white background</title>
  <desc>Flowtask favicon with white square background and F-shaped stacked task cards icon.</desc>

  <!-- White background -->
  <rect width="256" height="256" fill="#FFFFFF"/>

  <!-- Top card -->
  <rect x="36" y="40" width="154" height="48" rx="14" fill="#0E1B34"/>
  <circle cx="64" cy="64" r="11" fill="#FFFFFF"/>
  <rect x="95" y="57" width="86" height="14" rx="7" fill="#FFFFFF"/>

  <!-- Middle card -->
  <rect x="36" y="104" width="122" height="48" rx="14" fill="#526BEF"/>
  <circle cx="64" cy="128" r="11" fill="#FFFFFF"/>
  <rect x="95" y="121" width="66" height="14" rx="7" fill="#FFFFFF"/>

  <!-- Bottom card -->
  <rect x="36" y="168" width="90" height="48" rx="14" fill="#BFC5CF"/>
  <circle cx="64" cy="192" r="11" fill="#FFFFFF"/>
  <rect x="95" y="185" width="46" height="14" rx="7" fill="#FFFFFF"/>
</svg>
