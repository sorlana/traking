name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTIMAN_FTP_HOST }}
          username: ${{ secrets.HOSTIMAN_FTP_USERNAME }}
          password: ${{ secrets.HOSTIMAN_FTP_PASSWORD }}
          server-dir: /var/www/s265300/data/www/unique-style.ru/traking/
          exclude: |
            **/.git*
            **/.git*/**
            .gitignore
            .github/**
            .kiro/**
            .agents/**
            .osp/**
            .continue/**
            storage/logs/*
            storage/uploads/**
            public/generate-icons.php
